[env]
# Mapping paths to the specialized .agent directory structure
# Use 'npm install --prefix .agent' to populate this structure

_.rules_path = "{{config.root}}/.agent/rules/core-behavior"

[env.win11]
_.os_rules = "{{config.root}}/.agent/rules/powershell-conventions"
_.os_skills = "{{config.root}}/.agent/skills/powershell-expert"

[env.linux]
_.os_rules = "{{config.root}}/.agent/rules/posix-conventions"

[env.macos]
_.os_rules = "{{config.root}}/.agent/rules/posix-conventions"