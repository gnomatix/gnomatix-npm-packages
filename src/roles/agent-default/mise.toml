[env]
# Professional path mapping for the agent environment
GNOMATIX_RULES_PATH = "{{config_root}}/.agent/rules"
GNOMATIX_SKILLS_PATH = "{{config_root}}/.agent/skills"
GNOMATIX_WORKFLOWS_PATH = "{{config_root}}/.agent/workflows"

[tasks.setup]
description = "Atomically install and structure the agent environment using npm pack"
run = "node ../../scripts/deploy-role.js"

[tasks.setup_windows]
description = "Windows version of setup"
run = "node ../../scripts/deploy-role.js"