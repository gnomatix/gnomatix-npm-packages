[env]
# Local development overrides: point to the structured .agent directory
# After running 'mise run setup' (or manual layout), these paths will be active.

GNOMATIX_RULES_PATH = "{{config_root}}/.agent/rules"
GNOMATIX_SKILLS_PATH = "{{config_root}}/.agent/skills"
GNOMATIX_WORKFLOWS_PATH = "{{config_root}}/.agent/workflows"

[tool_alias]
# Add any local development aliases here
ga = "gemini"
gar = "mise run build && mise run setup"
