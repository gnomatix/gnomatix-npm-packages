[tasks.materialize]
description = "Materialize rules, skills, and workflows from installed bundles into .agent/"
run = "node scripts/materialize-bundles.js"
### ^--- See above!!! 

## BUG: I don't think this is currently working
[tasks.setup_plugin]
description = "Register the local Gnomatix mise backend plugin"
run = "mise plugin install gnomatix {{ exec(command='git rev-parse --show-toplevel') | trim }}/mise-plugin"
### ^--- See above!!! 

[tasks.clean]
description = "Remove all assembled bundles from build/"
run = "Remove-Item -Path {{ env.REPO_ROOT }}/build/* -Recurse -Force"
shell = "powershell"

##
## TODO:
##   - Confirm these 'cmd:subcommand' commands can be executed like:
##
##      mise run command subcommand
##  
##   - If not, refactor to use the new cli script that uses 'gum'
##
[tasks."build:bundles"]
description = "Assemble universal meta-package bundles"
depends = ["clean"]
run = "node {{ env.REPO_ROOT }}/scripts/build-bundles.js"

[tasks."publish:components"]
description = "Publish all atomic rules, skills, and workflows at current version"
run = "npm publish --workspaces --if-present --registry https://gitea.gnomatix.com/api/packages/GNOMATIX/npm/"

[tasks."publish:bundles"]
description = "Publish universal meta-packages"
run = "npm publish {{ env.REPO_ROOT }}/build/* --registry https://gitea.gnomatix.com/api/packages/GNOMATIX/npm/"

[tasks.release]
description = "Full release: Version -> Publish Components -> Build Meta-Packages -> Publish Bundles"
run = [
  "npm run release",
  "mise run publish:components",
  "mise run build",
  "mise run publish:bundles",
]

# Template Instantiation Tasks
[tasks.create]
description = "Scaffold a new item (Interactive Selection)"
run = "node {{ env.REPO_ROOT }}/scripts/create.js"

[tasks."create:action"]
description = "Scaffold a new Action"
run = "node {{ env.REPO_ROOT }}/scripts/create-action.js"

[tasks."create:mode"]
description = "Scaffold a new Mode"
run = "node {{ env.REPO_ROOT }}/scripts/create-mode.js"

[tasks."create:org-role"]
description = "Scaffold a new Org-Role"
run = "node {{ env.REPO_ROOT }}/scripts/create-org-role.js"

[tasks."create:role"]
description = "Scaffold a new Role"
run = "node {{ env.REPO_ROOT }}/scripts/create-role.js"

[tasks."create:rule"]
description = "Scaffold a new Rule"
run = "node {{ env.REPO_ROOT }}/scripts/create-rule.js"

[tasks."create:skill"]
description = "Scaffold a new Skill"
run = "node {{ env.REPO_ROOT }}/scripts/create-skill.js"

[tasks."create:workflow"]
description = "Scaffold a new Workflow"
run = "node {{ env.REPO_ROOT }}/scripts/create-workflow.js"

[tasks.build]
description = "Build a component (Interactive or Context-Aware)"
run = "node {{ env.REPO_ROOT }}/scripts/build.js"

[tasks.info]
description = "Show component metadata"
run = "node {{ env.REPO_ROOT }}/scripts/info.js"

[tasks.edit]
description = "Edit component main file"
run = "node {{ env.REPO_ROOT }}/scripts/edit.js"

[tasks.validate]
description = "Validate component structure and linting"
run = "node {{ env.REPO_ROOT }}/scripts/validate.js"

[tasks.rename]
description = "Rename a component"
run = "node {{ env.REPO_ROOT }}/scripts/rename.js"
