# PROJECT_WORKSPACE/mise.toml
#experimental_monorepo_root = false
#[monorepo]
#config_roots = [
#    "src/",
#    "utils/"
#]

[settings]
experimental = true

[tools]
gum = "latest"
node = "lts"
npm = "latest"
"npm:chalk" = "latest"
"npm:winston" = "3"
#"npm:@gnomatix/bundle-dipshit" = "latest"

[env]
# Standardized Workspace Root
REPO_ROOT = "{{ exec(command='git rev-parse --show-toplevel') | trim }}"

## NOTE:
##   'WORKSPACE_ROOT' is used to provide an absolute path at runtime
##   for the various tools and support scripts.
## WARN:
##   There is *zero* guarantee that [[ WORKSPACE_ROOT == REPO_ROOT ]]
##   will always be true. Repository refactoring may break this assumption.
## TODO:
##   Moving '.config/mise/mise.toml' => 'mise.toml' would allow:
##     WORKSPACE_ROOT = "{{ config_root }}"
##   Which is safer, and would also allow for (almost) seamless transition
##   to using the 'monorepo' funcationality that mise provides.
## INFO:
##   Enabling 'monorepo_root' would cause task commands to be prefixed
##   with the path to their defining toml file location, relative to
##   the monorepo_root. eg: '//create' TODO: confirm
WORKSPACE_ROOT = "{{ env.REPO_ROOT }}"

# Get the build version directly from the VERSION file in git
BUILD_VERSION = "{{ exec(command='git show HEAD:VERSION') | trim }}"

# OS-Dependent Path Logic Blocks
# Adding shims directory to the PATH so that mise can find our custom wrappers
#_.path = "{% if os() == 'windows' %}{{ config_root }}/utils/shims/pwsh{% else %}{{ config_root }}/utils/shims/bash{% endif %}"
_.path = "{% if os() == 'windows' %}{{ env.REPO_ROOT }}/utils/shims/pwsh{% else %}{{ env.REPO_ROOT }}/utils/shims/bash{% endif %}"

## v--- ___CONFIGURABLE SETTINGS BLOCK BEGINS____ ---v
##
## TODO: Consider putting this into a mise.local.toml file
##       \__ Actually, this could be duplicated and then
##           it would over-ride these default values on load.
##
## Examples: poopyhead -> cG9vcHloZWFk, dodobird -> ZG9kb2JpcmQ=, frack -> ZnJhY2s=
SANITIZATION_RULES = "cG9vcHloZWFk:💩,ZG9kb2JpcmQ=:🦤,ZnJhY2s=:🤬"

# Global Gum Styling (Inherited by scripts/info.js etc.)
# Note: Gum style flags use their names directly as environment variables.
BORDER = "double"
FOREGROUND = "212"
BORDER_FOREGROUND = "212"
ALIGN = "center"
MARGIN = "1 2"
PADDING = "1 2"
## ^--- ___CONFIGURABLE SETTINGS BLOCK BEGINS____ ---^


## v--- Provides a shell alias for 'gno' command line ---v
[shell_alias]
# This section is kept for POSIX compatibility (bash/zsh/fish)
gno = "mise run"

[hooks.enter]
shell = "pwsh"
script = "Set-Alias -Name gno -Value 'gno.ps1' -Scope Global"
## ^--- Provides a shell alias for 'gno' command line ---^

## TODO: Plugin code is **broken**.
#[plugins]
#gnomatix = "{{ exec(command='git rev-parse --show-toplevel') | trim }}/mise-plugin"
## TODO __/

##
## INFO: These commands are available with 'mise run' or 'gno' alias ---v
##

## BUG: I don't think this command should be run
##  \__ **unless** it's using npm to install from the private npm repo.
