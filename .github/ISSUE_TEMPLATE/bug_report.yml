name: Bug Report
description: File a report to help us improve the rules and skills.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you did...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of the rule/skill were you using?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Mise version, Gemini CLI version, etc.
